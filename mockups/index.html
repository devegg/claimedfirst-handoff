const artists=[{id:'ember',name:'Ember Vale',genre:'Dream pop / electronic',title:'AFTER\nLIGHT',color:'#526b54',listeners:6,claim:7,points:0,initial:'EV',blurb:'Hushed verses. A chorus that opens up the whole room. Ember makes late-night pop with an unexpectedly human pulse.'},{id:'juniper',name:'Juniper Static',genre:'Alternative / indie',title:'SOFT\nSIGNAL',color:'#6d5c85',listeners:23,claim:24,points:0,initial:'JS',blurb:'Guitar textures, imperfect edges, and melodies that linger. A new voice worth making room for.'},{id:'noon',name:'Noon Arcade',genre:'French house / disco',title:'GOOD\nCOMPANY',color:'#b75c3e',listeners:185,claim:18,points:284,initial:'NA',blurb:'Warm basslines and bright, unhurried grooves. Music for taking the long way home.'},{id:'violet',name:'Violet Index',genre:'Ambient / cinematic',title:'IN THE\nQUIET',color:'#556976',listeners:91,claim:9,points:192,initial:'VI',blurb:'Small melodies in spacious worlds. Atmospheric work that rewards a second listen.'},{id:'paper',name:'Paper Satellites',genre:'Indie folk / acoustic',title:'SLOW\nORBIT',color:'#94744e',listeners:78,claim:12,points:168,initial:'PS',blurb:'Stories told gently, with layered acoustic textures and a sense of place.'},{id:'echo',name:'Echo District',genre:'Trip hop / downtempo',title:'SIDE\nSTREETS',color:'#5e7662',listeners:120,claim:21,points:203,initial:'ED',blurb:'Dusty percussion meets deep, cinematic bass. A soundtrack for the city after dark.'}];
let roster=['noon','violet','paper','echo'],watch=[],slots=5,page='discover',selected='ember',division=5,board='division';let toastTimer;const $=s=>document.querySelector(s),artist=id=>artists.find(a=>a.id===id);const nav=[['discover','◉','Discover'],['roster','▦','My roster'],['watch','◷','Watchlist'],['season','↗','The season'],['history','◇','My discoveries'],['expand','＋','Roster plans']];
function go(p){page=p;render();window.scrollTo(0,0)}function render(){ $('#nav').innerHTML=nav.map(([p,i,n])=>`<button class="${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}')"><i>${i}</i>${n}${p==='watch'&&watch.length?' · '+watch.length:''}</button>`).join('');$('#capacity').textContent=`${roster.length} / ${slots} roster slots`;$('#view').innerHTML=views[page]();}
function head(label,title,sub,action=''){return `<div class="title-row"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}function btn(text,js,secondary=false){return `<button class="btn ${secondary?'secondary':''}" onclick="${js}">${text}</button>`}function cover(a){return `<div class="cover" style="--cover:${a.color}"><small>ORIGINAL AI MUSIC / ${a.initial}</small><span class="symbol"></span><strong>${a.title.replace('\n','<br>')}</strong><button aria-label="View ${a.name}" onclick="detail('${a.id}')">↗</button></div>`}function card(a){return `<article class="artist-card">${cover(a)}<h3>${a.name}</h3><p>${a.genre}</p><div class="row"><span class="small-stat">${a.listeners+(roster.includes(a.id)&&a.points===0?1:0)} supporters</span><button onclick="detail('${a.id}')">${roster.includes(a.id)?'On your roster':'Meet artist ↗'}</button></div></article>`}function note(text){return `<div class="note"><span class="badge">✳</span><div>${text}</div></div>`}
const views={
discover:()=>head('Good ears. Early instincts.','Your next great find.','Find an artist you believe in. Give them a place on your roster.')+`<section class="feature"><div class="feature-art"><div class="cover-label">afterlight<br><small style="font-size:15px;letter-spacing:1px;font-style:normal">EMBER VALE</small></div><div class="disc"></div><span class="art-number">EV—001 / DEBUT</span></div><div class="feature-content"><div><span class="tag">THE EARLY LIST</span></div><h2>Ember Vale</h2><p>For the ones who stay for the last song.<br>Dream pop with a little darkness around the edges.</p><div class="meta"><span>${roster.includes('ember')?'7':'6'} supporters</span><span>·</span><span>Dream pop / electronic</span></div><div class="feature-actions">${btn(roster.includes('ember')?'On your roster ✓':'Meet your next pick ↗',"detail('ember')")}${btn(watch.includes('ember')?'Watching ✓':'Watch',"toggleWatch('ember')",true)}</div></div></section><div class="section-head"><h2>A little off the radar.</h2><small>Fictional artists · real possibilities</small></div><div class="cards">${['juniper','noon','violet','paper'].map(id=>card(artist(id))).join('')}</div>`+note(`<strong>${slots-roster.length>0?`You have ${slots-roster.length} open ${slots-roster.length===1?'slot':'slots'}. Make ${slots-roster.length===1?'it':'them'} count.`:'Your roster is full. Your watchlist isn’t.'}</strong> ${slots-roster.length>0?'Your next discovery could be your best one.':'Watch an artist, replace a pick, or explore a larger roster.'}`),
roster:()=>head('Your taste. Your choices.','The artists you back.','Every place on your roster says something about you.',btn('Find an artist ↗',"go('discover')"))+`<div class="stat-grid"><div class="stat"><div class="eyebrow">Roster</div><b>${roster.length}<span style="color:var(--muted);font-size:24px"> / ${slots}</span></b><small>Active support slots</small></div><div class="stat"><div class="eyebrow">Season points</div><b>${roster.reduce((s,id)=>s+artist(id).points,0)}</b><small>Illustrative totals</small></div><div class="stat"><div class="eyebrow">Your division</div><b>5-slot</b><small>Upgrades apply next season in this demo</small></div></div><div class="roster">${roster.map(id=>{const a=artist(id);return `<div class="roster-item"><div class="mini" style="--cover:${a.color}">${a.initial}</div><div class="grow"><h3>${a.name}</h3><p>Original claim #${a.claim} · ${a.points?'Active this season':'New discovery'}</p></div><div class="points">${a.points}<small>sample points</small></div><button class="quiet" onclick="detail('${id}')">View</button></div>`}).join('')}${roster.length<slots?`<button class="slot" onclick="go('discover')">＋ ${slots-roster.length} open ${slots-roster.length===1?'place':'places'} for your next discovery</button>`:''}</div>`+note('<strong>A roster, not a playlist.</strong> You can appreciate anyone. These are the artists you choose to actively champion.'),
watch:()=>head('Keep an ear out.','Worth watching.','No slot used. No claim number reserved. Just possibilities.')+(watch.length?`<div class="cards">${watch.map(id=>card(artist(id))).join('')}</div>`:`<div class="empty"><div class="eyebrow">A little room for curiosity</div><h2>Who’s on your radar?</h2><p class="sub">Watch an artist before committing a roster slot.</p><br>${btn('Explore artists',"go('discover')")}</div>`),
artist:()=>{const a=artist(selected);return head('Artist profile',a.name,a.genre,btn('← Discover',"go('discover')",true))+`<div class="artist-detail"><div>${cover(a)}<p class="sub" style="margin-top:16px">Fictional creator · demo artwork</p></div><div><span class="tag">${a.listeners+(roster.includes(a.id)&&!a.points?1:0)} SUPPORTERS HERE</span><h2>A place on your roster?</h2><p class="sub">${a.blurb}</p><div class="meta"><span>${roster.includes(a.id)?'Your original claim':'Sample claim'} #${a.claim}</span><span>·</span><span>${Math.max(0,slots-roster.length)} ${slots-roster.length===1?'slot':'slots'} available</span></div><div class="feature-actions">${btn(roster.includes(a.id)?'On your roster ✓':'Claim this artist',`claim('${a.id}')`)}${btn(watch.includes(a.id)?'Watching ✓':'Watch artist',`toggleWatch('${a.id}')`,true)}</div><div class="section-head"><h2>Start with these.</h2></div>${[a.title.replace('\n',' ').toLowerCase(),'A different kind of light'].map((t,i)=>`<div class="track"><button aria-label="Audio availability" onclick="toast('Audio is not included in this static concept.')">▷</button><div class="grow"><div style="text-transform:capitalize">${t}</div><small>Sample track · audio not included</small></div><small>${i?'4:12':'3:28'}</small></div>`).join('')}</div></div>`+note('<strong>Your claim records early support within ClaimedFirst.</strong> It does not imply ownership of the artist or music.');},
season:()=>head('Season 01 · The first wave','Good taste has company.','A fresh season. A new set of discoveries. A place to make your mark.')+`<div class="tabs" aria-label="Scoreboard concept">${['division','average'].map(b=>`<button class="${board===b?'active':''}" onclick="board='${b}';render()">${b==='division'?'Capacity divisions':'Average score · alternative'}</button>`).join('')}</div>${board==='division'?`<div class="tabs" aria-label="Roster division">${[5,10,20,30,50].map(n=>`<button class="${division===n?'active':''}" onclick="division=${n};render()">${n} slots</button>`).join('')}</div>`:''}<div class="section-head"><h2>${board==='division'?division+'-slot division':'Across roster sizes'}</h2><span class="chip">12 days remaining · sample</span></div><div class="scoreboard"><table><thead><tr><th>Rank</th><th>Scout</th><th>${board==='average'?'Slots':'Best early claim'}</th><th>${board==='average'?'Average points':'Season points'}</th></tr></thead><tbody>${leaderRows()}</tbody></table></div>`+note(board==='division'?'<strong>One possible ruleset.</strong> Compete with players who have the same scoring capacity. In this demo, capacity upgrades move you to a new division next season.':'<strong>An alternative to divisions.</strong> Sample average = total points ÷ locked scoring slots. It changes the standings; it does not prove fairness. Weights, empty slots, and transfers still need rules.')+`<p class="rules">Scores and rankings are fictional. Seasonal prizes are an option for a future developer; none are offered in this demo.</p>`,
expand:()=>head('More artists to believe in.','Make a little more room.','Paid roster expansion is part of the original concept. The final pricing is open.')+`<div class="pricing">${[['Listener',5,'Free starting tier'],['Scout',10,'Free / paid path undecided'],['Curator',20,'Paid expansion concept'],['Tastemaker',30,'Paid expansion concept'],['Legend',50,'Paid expansion concept']].map(([n,c,t])=>`<article class="plan ${slots===c?'selected':''}"><div class="eyebrow">${slots===c?'Current preview':'Roster tier'}</div><h2>${n}</h2><b>${c}</b><p>artist slots</p><p>${t}</p>${btn(slots===c?'Current roster':'Preview '+c+' slots',`previewSlots(${c})`,slots!==c)}</article>`).join('')}</div>`+note('<strong>More capacity. A clear competition format.</strong> This concept places upgrades into their new scoring division next season. Averages or weighted scoring are other options.')+`<div class="section-head"><h2>A model a developer can sustain.</h2></div><p class="sub">Roster revenue could support hosting, maintenance, development time, and potentially seasonal rewards. Prices, payment frequency, and prizes remain decisions for a future builder.</p><p class="rules">Previewing a tier changes only this temporary demonstration. There is no checkout or payment. Reload or reset to restore the original roster.</p>`,
history:()=>head('A record of your ear.','You were there early.','Seasons come and go. Your discovery story stays with you.')+`<div class="split"><div class="history-card"><small>CLAIMEDFIRST / DISCOVERY RECORD</small><h2>You heard<br>something in them.</h2><div><div class="big">#${roster.includes('ember')?'7':'18'}</div><p>${roster.includes('ember')?'Ember Vale':'Noon Arcade'} · your original claim</p></div><small>${roster.includes('ember')?'7':'185'} SUPPORTERS HERE · FICTIONAL EXAMPLE</small></div><div class="history-copy"><div class="eyebrow">Your collection of firsts</div><h2>Taste with a paper trail.</h2><p class="sub">Your original claim tells when you first supported an artist. Your active roster tells who you’re backing now.</p><br><p class="sub">A future share card could celebrate an artist’s growth alongside your early place in their story.</p><br>${btn('Back to my roster',"go('roster')")}</div></div>`,
guide:()=>head('Behind the concept','A game worth imagining.','A static exploration of Brian Boyd’s ClaimedFirst idea.')+`<div class="rules"><p>This is a private concept demonstration for a future independent developer, not a working service. All artists, songs, people, artwork labels, counts, and scores are fictional. No audio, account, payment, prize, or external music connection is active.</p><h2>Try the journey</h2><ol><li>Meet Ember Vale and claim your fifth roster slot.</li><li>Explore Juniper Static. Choose Watch, Replace, or a larger roster.</li><li>Compare capacity divisions and average-score standings.</li><li>Explore roster tiers and your discovery record.</li></ol><h2>Illustrative rules, not requirements</h2><p>The demo uses five starting slots, app-specific claim numbers, and capacity divisions. Expanded capacity applies to next season’s scoring. Replacement is simulated without recalculating a complete season. The original 30-day re-entry cooldown is shown as a concept consequence. Points are sample data, not outputs of a finished scoring system.</p><p>All changes live only in this page’s memory and disappear on reload. The original concept, revenue choices, weighted scoring, and other alternatives remain open for a future builder. SpinRoom and listening parties are separate.</p><br>${btn('Explore the concept',"go('discover')")}</div>`};
function leaderRows(){let rows=board==='average'?[['01','Maya FM','5','224.0'],['02','Analog Soul','20','209.5'],['03','The Night Shift','10','190.0'],['04','Jamie Rivers','5','169.4'],['05','Soft Signal','30','151.2']]:[['01','Maya FM','#4','1,120'],['02','The Night Shift','#11','986'],['03','Analog Soul','#6','914'],['04',division===5?'Jamie Rivers':'Cassette Club','#18','847'],['05','Soft Signal','#23','756']];return rows.map(r=>`<tr class="${r[1]==='Jamie Rivers'?'you':''}"><td class="rank">${r[0]}</td><td>${r[1]}${r[1]==='Jamie Rivers'?' <small>YOU</small>':''}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
function detail(id){selected=id;go('artist')}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}function toggleWatch(id){if(watch.includes(id)){watch=watch.filter(x=>x!==id);toast('Removed from your watchlist.')}else{watch.push(id);toast('Added to your watchlist. No roster slot used.')}render()}function openModal(title,body,actions){$('#modal').innerHTML=`<button class="dialog-close" aria-label="Close dialog" onclick="closeModal()">×</button><div class="eyebrow">Your next move</div><h2 id="modal-title">${title}</h2>${body}<div class="dialog-actions">${actions}</div>`;$('#modal').showModal()}function closeModal(){$('#modal').close()}function claim(id){if(roster.includes(id)){go('roster');return}const a=artist(id);if(roster.length>=slots){openModal('Good taste. Full roster.',`<p>${a.name} caught your ear. All ${slots} of your places are taken. What’s your next move?</p>`,btn('Watch for now',`toggleWatch('${id}');closeModal()`)+btn('Compare & replace a pick',`replaceChoices('${id}')`,true)+btn('Explore larger rosters',"closeModal();go('expand')",true));return}openModal('Back '+a.name+'?',`<p>Use one of your ${slots} slots to champion this artist. You’ll receive sample claim #${a.claim} within ClaimedFirst.</p><p>${slots-roster.length===1?'This will fill your last open slot.':'You have '+(slots-roster.length)+' open slots.'}</p>`,btn('Claim my place',`confirmClaim('${id}')`)+btn('Keep exploring','closeModal()',true))}function confirmClaim(id){roster.push(id);watch=watch.filter(x=>x!==id);closeModal();render();toast(`You’re supporter #${artist(id).claim} for ${artist(id).name}.`)}function replaceChoices(id){$('#modal').innerHTML=`<button class="dialog-close" aria-label="Close dialog" onclick="closeModal()">×</button><div class="eyebrow">Make a little room</div><h2 id="modal-title">Who leaves your roster?</h2><p>Your original claim stays in history. The original rules proposed a 30-day wait before returning; this demo only illustrates the choice.</p>${roster.map(old=>`<div class="replace-row"><span>${artist(old).name}</span>${btn('Replace',`confirmReplace('${old}','${id}')`,true)}</div>`).join('')}`;}function confirmReplace(old,id){roster=roster.map(x=>x===old?id:x);watch=watch.filter(x=>x!==id);closeModal();go('roster');toast(`${artist(id).name} joins your roster. Replacement simulated.`)}function previewSlots(n){if(n<roster.length){toast('This preview tier is smaller than your active roster. Reset to try it.');return}slots=n;render();toast(`${n}-slot roster preview. No purchase made.`)}function resetDemo(){roster=['noon','violet','paper','echo'];watch=[];slots=5;division=5;board='division';go('discover');toast('Demo reset. Four artists. One open slot.')}render();
</script></body></html>
