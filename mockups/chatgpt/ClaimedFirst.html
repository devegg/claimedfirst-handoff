<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaimedFirst — Mockup, fictional data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400,0,1;9..144,600,0,1&display=swap" rel="stylesheet">
<style>
:root{--bg:#121613;--panel:#1b211c;--panel2:#252d26;--line:#3e4a40;--text:#f3efe5;--muted:#bac4b8;--dim:#93a092;--accent:#e48c72;--accentdark:#3c2925;--display:Fraunces,Georgia,serif;--body:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}html{background:#0c100d}body{margin:0;color:var(--text);background:var(--bg);font:15px/1.5 var(--body)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin-top:0}h1,h2,h3,.serif{font-family:var(--display);font-weight:400;line-height:1.08}h1{font-size:clamp(2.8rem,5vw,5.5rem);letter-spacing:-.04em}h2{font-size:clamp(2rem,3vw,3.25rem);letter-spacing:-.035em}h3{font-size:1.65rem}small,.small{font-size:.82rem}.eyebrow,.kicker{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}.muted{color:var(--muted)}.dim{color:var(--dim)}.wrap{max-width:1180px;margin:auto;padding:0 28px}.shell{min-height:100vh;background:radial-gradient(circle at 80% 5%,#283429 0,transparent 34%),var(--bg)}.shell.mobile{width:390px;max-width:100%;min-height:780px;margin:22px auto;box-shadow:0 22px 80px #000b;border:1px solid var(--line);overflow:hidden}.top{height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.brand{font-family:var(--display);font-size:1.55rem;letter-spacing:-.04em;color:var(--text);text-decoration:none;white-space:nowrap}.brand i{color:var(--accent);font-style:normal}.topright,.topnav,.actions,.row{display:flex;align-items:center;gap:10px}.topnav{gap:3px}.topnav button,.iconbtn,.plain{background:transparent;border:0;color:var(--muted);padding:9px 11px;border-radius:5px}.topnav button:hover,.topnav button.active,.plain:hover{color:var(--text);background:var(--panel2)}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:44px;padding-top:32px;padding-bottom:80px}.side{position:sticky;top:20px;align-self:start}.side button{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:0;border-left:2px solid transparent;color:var(--muted)}.side button.active{color:var(--text);border-color:var(--accent);background:var(--panel)}.side .group{margin:22px 14px 7px}.main{min-width:0}.mobile .layout{display:block;padding:22px 20px 86px}.mobile .side,.mobile .topnav,.mobile .desktop-only{display:none}.mobile .top{height:66px;padding:0 20px}.mobile .brand{font-size:1.36rem}.mobile .topright{gap:4px}.mobile .viewbtn{font-size:.75rem}.mobile .mobile-nav{display:flex}.mobile .hero-grid,.mobile .two,.mobile .three,.mobile .artist-hero,.mobile .manage-grid,.mobile .leader-grid{grid-template-columns:1fr}.mobile h1{font-size:3rem}.mobile .record.large{width:220px;height:220px}.mobile .page-head{align-items:start}.mobile .cards{grid-template-columns:1fr}.mobile .statline{flex-wrap:wrap}.mobile .share-layout{grid-template-columns:1fr}.mobile .story{height:310px;width:175px}.mobile .square{width:220px;height:220px}.mobile .table-row{grid-template-columns:35px 1fr auto}.mobile .table-row .hide-mobile{display:none}.mobile .hero{padding:30px 0}.mobile .copylink{overflow-wrap:anywhere}.mobile .section{margin-top:40px}
.mobile-nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:390px;max-width:100%;z-index:10;background:#192019f5;border-top:1px solid var(--line);justify-content:space-around;padding:5px 4px max(5px,env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:var(--muted);font-size:.71rem;padding:6px 3px;min-width:48px}.mobile-nav button.active{color:var(--accent)}.mobile-nav span{display:block;font-size:1.2rem;line-height:1.1}.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:26px}.page-head h1,.page-head h2{margin:4px 0 0}.hero{padding:65px 0}.hero-grid,.artist-hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:42px}.hero p.lede{max-width:490px;font-size:1.12rem;color:var(--muted)}.hero-art{display:grid;place-items:center;min-height:330px}.record{position:relative;flex:none;border-radius:50%;background:repeating-radial-gradient(circle at center,#1c221d 0 2px,#344136 3px 4px,#111712 5px 7px);border:1px solid #51604f;box-shadow:inset 0 0 45px #000,0 30px 65px #0008}.record.large{width:320px;height:320px}.record.medium{width:180px;height:180px}.record.small{width:72px;height:72px}.record:before{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--accent);border:8px solid #a96150;box-shadow:0 0 0 1px #141814}.record:after{content:"";position:absolute;inset:49%;border-radius:50%;background:#171b18}.record.blue{filter:hue-rotate(80deg) saturate(.7)}.record.cream{filter:hue-rotate(170deg) saturate(.6)}.record.large:before{border-width:14px}.record.medium:before{border-width:10px}.btn{border:1px solid var(--accent);background:var(--accent);color:#231b18;border-radius:3px;padding:12px 17px;font-weight:700;line-height:1.2;min-height:44px}.btn:hover{background:#f3a38c}.btn.secondary{background:transparent;color:var(--text);border-color:var(--line)}.btn.secondary:hover{border-color:var(--accent)}.btn.ghost{background:transparent;border:0;color:var(--accent);padding-left:0}.btn.tiny{min-height:34px;padding:7px 11px;font-size:.8rem}.field{display:block;width:100%;border:1px solid var(--line);background:#111712;color:var(--text);border-radius:3px;padding:12px 13px;min-height:44px}.field::placeholder{color:#9aa89b}.field:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}.fieldlabel{display:block;font-size:.79rem;font-weight:700;margin:14px 0 6px}.formline{display:flex;gap:9px;max-width:475px}.formline .field{flex:1;min-width:0}.section{margin-top:58px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}.section-head h2,.section-head h3{margin:0}.rule{border-top:1px solid var(--line);padding-top:20px}.cards,.three,.two{display:grid;gap:16px}.cards,.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.panel{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:3px;min-width:0}.card{transition:border-color .2s,transform .2s}.card:hover{border-color:#758376;transform:translateY(-2px)}.card h3{font-size:1.35rem;margin:12px 0 4px}.card p{margin-bottom:0}.artbox{display:grid;place-items:center;height:180px;background:radial-gradient(circle at 50% 35%,#334135,#171d18 70%);overflow:hidden}.artbox .record{width:125px;height:125px}.card .artbox{margin:-18px -18px 15px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.78rem}.notice{border-left:3px solid var(--accent);background:#34261f;color:#f4ded4;padding:13px 16px;margin:18px 0}.notice.neutral{border-color:#89978b;background:#242d25;color:var(--text)}.notice.bad{border-color:#ed9a8d;background:#3a2524}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--accent);color:var(--accent);padding:4px 8px;border-radius:2px;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.badge.grey{border-color:var(--line);color:var(--muted)}.stack>*+*{margin-top:12px}.statline{display:flex;gap:24px;padding:16px 0;border-block:1px solid var(--line);margin:22px 0}.statline strong{display:block;font:1.6rem var(--display)}.statline span{font-size:.77rem;color:var(--muted)}.list{display:grid;gap:0}.listrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.listrow .row{min-width:0}.listrow .record{width:42px;height:42px}.listrow .record:before{border-width:4px}.listrow b{font-weight:600}.listrow small{display:block;color:var(--muted)}.artist-hero{align-items:start}.artist-hero .hero-art{min-height:280px;background:radial-gradient(circle,#344236,#1c241d 65%,#131914);border:1px solid var(--line)}.artist-hero .record{width:230px;height:230px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:auto}.tabs button{border:0;background:none;color:var(--muted);padding:11px 14px;white-space:nowrap;border-bottom:2px solid transparent}.tabs button.active{color:var(--text);border-color:var(--accent)}.boardrow,.table-row{display:grid;grid-template-columns:40px 1fr 115px 120px;gap:10px;align-items:center;padding:11px 10px;border-bottom:1px solid var(--line);font-size:.88rem}.boardrow:nth-child(odd),.table-row:nth-child(odd){background:#222a23}.boardrow.pending{opacity:.57}.boardrow strong,.table-row strong{font-weight:600}.table-row.me{border:1px solid var(--accent);background:#392a25}.slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}.slot{aspect-ratio:1;border:1px solid var(--line);display:grid;place-items:center;position:relative;background:#1b231d;color:#8e9d8f;font-size:.65rem}.slot.active{background:var(--accentdark);border-color:var(--accent);color:var(--text)}.slot.locked{background:#151b16}.slot.mark:after{content:"◆";position:absolute;right:2px;top:-4px;color:var(--accent);font-size:.62rem}.mobile .slots{gap:3px}.mobile .slot{font-size:.52rem}.mobile .slot.mark:after{right:0}.progress{height:7px;background:#3d493e;margin:12px 0}.progress>span{display:block;height:100%;background:var(--accent)}.big-number{font:clamp(5rem,13vw,10rem)/.9 var(--display);color:var(--accent);letter-spacing:-.08em}.stamp{animation:stamp .65s cubic-bezier(.2,.8,.2,1) both}@keyframes stamp{from{opacity:0;transform:scale(1.5) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}.share-layout,.manage-grid,.leader-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.share-preview{display:flex;align-items:center;justify-content:center;background:#0d120e;border:1px solid var(--line);padding:20px;min-height:360px}.sharecard{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 34%,#405244,#202a22 55%,#121813);border:1px solid #6d7a6b;color:var(--text);padding:20px;display:flex;flex-direction:column;justify-content:space-between}.sharecard .record{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);opacity:.7;width:74%;aspect-ratio:1}.sharecard .foreground{position:relative;z-index:1}.sharecard b{font:2.3rem/.95 var(--display);display:block}.sharecard .n{font:5rem/.9 var(--display);color:var(--accent)}.story{width:205px;height:365px}.square{width:300px;height:300px}.square .n{font-size:4rem}.sharecard small{letter-spacing:.14em;text-transform:uppercase}.chatbubble{max-width:310px;padding:14px;background:#303d32;border-radius:16px 16px 3px 16px;margin-left:auto}.linkpreview{border:1px solid #708271;background:#1a251d;margin-top:8px;padding:12px}.overlay{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:end;justify-content:center;padding:20px}.sheet{width:min(100%,490px);background:#202921;border:1px solid #687769;padding:26px;max-height:90vh;overflow:auto;box-shadow:0 18px 60px #000c}.sheet h2{font-size:2rem}.sheet-head{display:flex;align-items:start;justify-content:space-between;gap:10px}.choice{display:block;padding:14px;border:1px solid var(--line);margin:9px 0;cursor:pointer}.choice:has(input:checked){border-color:var(--accent);background:var(--accentdark)}.choice input{accent-color:var(--accent);margin-right:9px}.toast{position:fixed;right:18px;bottom:18px;z-index:40;background:#e48c72;color:#241b17;padding:12px 16px;font-weight:700;box-shadow:0 9px 24px #0008}.mobile .toast{bottom:73px;left:16px;right:16px}.foot{border-top:1px solid var(--line);padding:28px 0 50px;color:var(--muted);font-size:.78rem}.foot .row{justify-content:space-between}.mobile .foot{padding:20px 20px 85px}.mobile .foot .row{display:block}.sep{height:1px;background:var(--line);margin:20px 0}.textlink{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0}.status{min-height:21px;font-size:.79rem;margin-top:5px}.good{color:#c5dfc7}.error{color:#f6aa9e}.hidden{display:none!important}@media(max-width:760px){.shell:not(.mobile) .layout{display:block;padding:22px 20px 86px}.shell:not(.mobile) .side,.shell:not(.mobile) .topnav{display:none}.shell:not(.mobile) .mobile-nav{display:flex}.shell:not(.mobile) .top{padding:0 20px}.shell:not(.mobile) .hero-grid,.shell:not(.mobile) .two,.shell:not(.mobile) .three,.shell:not(.mobile) .cards,.shell:not(.mobile) .artist-hero,.shell:not(.mobile) .manage-grid,.shell:not(.mobile) .leader-grid,.shell:not(.mobile) .share-layout{grid-template-columns:1fr}.shell:not(.mobile) .slots{gap:3px}.shell:not(.mobile) .boardrow,.shell:not(.mobile) .table-row{grid-template-columns:35px 1fr auto}.shell:not(.mobile) .hide-mobile{display:none}.shell:not(.mobile) .foot{padding:20px 20px 85px}.shell:not(.mobile) .hero{padding:30px 0}.shell:not(.mobile) .record.large{width:220px;height:220px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S={page:'landing',mode:'desktop',modal:'',toast:'',handle:'',handleOK:false,invited:true,artist:'unverified',artistTab:'overview',claimed:false,claimNo:7,claimPrivacy:'named',watching:false,watchPrivacy:'named',dropped:false,cooldown:false,full:false,verification:'idle',verified:false,frozen:false,removed:false,shareSize:'story',shareKind:'claim',milestone:1000,audienceTab:'claimed',songCount:5,friendCount:1,notificationsRead:false,many:false,pg:{a:1,h:1,w:1}};
const names=['landing','login','onboarding','home','submit','artist','share','friend','roster','profile','leaderboard','invite','manage','notifications','terms'];
const nav=[['home','Discover'],['artist','Artist page'],['roster','Roster'],['leaderboard','Season'],['profile','Profile']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(label,action,cls='btn',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`}
function badge(t,grey=false){return `<span class="badge ${grey?'grey':''}">${t}</span>`}
function record(cls='small',tone=''){return `<div class="record ${cls} ${tone}" aria-hidden="true"></div>`}
function head(k,t,aside=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${t}</h1></div>${aside}</div>`}
function section(t,b){return `<section class="section"><div class="section-head"><h2>${t}</h2></div>${b}</section>`}
function layout(content){return `<div class="shell ${S.mode==='mobile'?'mobile':''}"><header class="top wrap"><a class="brand" href="#landing" data-page="landing">Claimed<i>First</i>.</a><nav class="topnav" aria-label="Main">${nav.map(([id,t])=>`<button data-page="${id}" class="${S.page===id?'active':''}">${t}</button>`).join('')}</nav><div class="topright">${button(S.mode==='desktop'?'◫ Mobile':'▣ Desktop','mode','btn secondary tiny viewbtn')}<button class="plain" data-page="notifications" aria-label="Notifications">◌</button></div></header><div class="layout wrap"><aside class="side" aria-label="All pages"><div class="eyebrow group">Explore prototype</div>${[['landing','Teaser'],['login','Login'],['onboarding','Onboarding'],['home','Discover'],['submit','Submit artist'],['artist','Artist page'],['share','Share studio'],['friend','Friend’s view'],['roster','Roster'],['profile','Scout profile'],['leaderboard','Season board'],['invite','Invite friends'],['manage','Artist manage'],['notifications','Notifications'],['terms','Terms & privacy']].map(([id,t])=>`<button class="${S.page===id?'active':''}" data-page="${id}">${t}</button>`).join('')}</aside><main class="main" id="main">${content}</main></div><footer class="foot wrap"><div class="row"><span>ClaimedFirst · Mockup, fictional data.</span><span>Recognition only. No prizes, cash or payments. <button class="textlink" data-page="terms">Terms & privacy</button></span></div></footer><nav class="mobile-nav" aria-label="Main">${nav.map(([id,t],i)=>`<button data-page="${id}" class="${S.page===id?'active':''}"><span>${['⌂','◉','▦','≋','○'][i]}</span>${t}</button>`).join('')}</nav></div>${modal()}${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}`}
function landing(){return `<div class="hero hero-grid"><div><div class="eyebrow">The guest list is open</div><h1>Hear it first.<br><em>Keep the number.</em></h1><p class="lede">Your taste leaves a mark.</p><label class="fieldlabel" for="guest">Email for the guest list</label><div class="formline"><input id="guest" class="field" type="email" placeholder="you@example.com" autocomplete="email">${button('Get on the list','guest')}</div><p class="small muted">A permanent number for artists you find early.</p></div><div class="hero-art">${record('large')}</div></div><div class="rule small muted">Mockup, fictional data. ${button('Explore the prototype →','goHome','btn ghost tiny')}</div>`}
function login(){return `${head('Welcome back','The door is open.')}<div class="two"><div class="panel"><h3>Come in by email</h3><label class="fieldlabel" for="loginEmail">Email address</label><input id="loginEmail" class="field" type="email" placeholder="you@example.com"><p></p>${button('Send my link','magic')}<p class="small muted">A sign-in link lands in your inbox.</p></div><div class="panel"><h3>Or use your account</h3><div class="stack">${button('Continue with Google','loginGo','btn secondary')}${button('Continue with Apple','loginGo','btn secondary')}</div></div></div>`}
function slots(){let used=S.full?5:(S.claimed?1:0);return `<div class="slots" aria-label="50 roster slots; ${used} occupied, ${S.full?5:5} unlocked">${Array.from({length:50},(_,i)=>`<div class="slot ${i<used?'active':''} ${i>=5?'locked':''} ${[4,9,19,29,49].includes(i)?'mark':''}" aria-label="Slot ${i+1}${i<used?', occupied':i>=5?', locked':', open'}">${i<used?'●':i<5?String(i+1):''}</div>`).join('')}</div>`}
function onboarding(){return `${head('First steps','Make your mark.')}<div class="two"><div class="panel"><h3>Choose a handle</h3>${S.invited?`<p>${badge('invited by @maya')}</p>`:''}<label class="fieldlabel" for="handle">Your handle</label><div class="row"><span>@</span><input id="handle" class="field" maxlength="20" value="${esc(S.handle)}" placeholder="your_name" autocomplete="off"></div><div id="handleStatus" class="status ${S.handleOK?'good':'muted'}" aria-live="polite">${handleMessage(S.handle)}</div>${button('Keep this handle','saveHandle','btn','id="keepHandle" '+(S.handleOK?'':'disabled'))}<p class="small muted">3–20 lowercase letters, numbers or underscores.</p></div><div class="panel"><div class="row" style="justify-content:space-between"><h3>Your first roster</h3>${badge('Original Scout')}</div><p class="muted">Five places to start. Bring friends to open more.</p>${slots()}<p class="small muted">Your first artist belongs here.</p></div></div>`}
function artistCard(name,signal,tone=''){return `<article class="card"><div class="artbox">${record('medium',tone)}</div><div class="meta"><span>Fictional artist</span><span>◌</span></div><h3>${name}</h3><p class="small muted">${signal}</p><p>${button('Listen & discover','goArtist','btn secondary tiny')}</p></article>`}
function home(){return `${head('Listening room','Find your next first.',button('Submit an artist','goSubmit','btn secondary'))}<div class="notice neutral">The artists here are fictional. Your claim number is set by arrival order and stays yours forever.</div><div class="cards">${artistCard('Ember Vale','3 scouts claimed this today')}${artistCard('Sable Current','12 scouts claimed this week','blue')}${artistCard('Morrow Field','Newly added by listeners','cream')}</div>${section('Signals from the floor',`<div class="list panel"><div class="listrow"><div>${record()}<span><b>Ember Vale</b><small>3 scouts claimed this today</small></span></div>${button('Visit','goArtist','btn secondary tiny')}</div><div class="listrow"><span><b>Sable Current</b><small>Just reached 100 claimers</small></span>${button('See artist','goArtist','btn secondary tiny')}</div></div>`)}`}
function submit(){return `${head('From the crowd','Put an artist on the map.')}<div class="two"><div class="panel"><p class="muted">Give us their name and one public page. A fan-created page goes live after three independent scouts submit the same artist, or when the artist verifies it.</p><label class="fieldlabel" for="artistName">Artist name</label><input id="artistName" class="field" placeholder="e.g. Ember Vale"><label class="fieldlabel" for="artistLink">Public link</label><input id="artistLink" class="field" type="url" placeholder="https://..."><p></p>${button('Add to the listening room','submitArtist')}</div><div class="panel"><div class="eyebrow">Pending example</div><h3>Morrow Field</h3><p>2 of 3 independent scouts have submitted this artist.</p><div class="progress"><span style="width:66%"></span></div><p class="small muted">The page is waiting for one more scout. An artist can verify and open it sooner.</p>${button('View pending page','pendingArtist','btn secondary')}</div></div>`}
function statusCopy(){let a=S.artist;if(S.removed)return `<div class="notice bad">This page was removed by the artist. Claims are unavailable.</div>`;if(a==='pending')return `<div class="notice neutral">Pending page · 2 of 3 independent scouts have submitted this artist. Claims open when the page goes live.</div>`;if(a==='disputed')return `<div class="notice bad">This page is disputed while we review who it represents. Claims are paused.</div>`;if(S.frozen||a==='frozen')return `<div class="notice neutral">New claims are frozen by the artist. Existing claim numbers stay in place.</div>`;return `<div class="notice neutral">${S.verified||a==='verified'?'Verified artist':'Fan-created page, not verified by the artist'}</div>`}
function founders(){let rows=[['1','@lena','Active','June 4'],['2','Anonymous scout','Historical claim','June 5'],['5','@rue','In 9 days','June 22']];if(S.claimed||S.dropped)rows.push(['7',S.claimPrivacy==='named'?'@maya':'Anonymous scout',S.dropped?'Historical claim':'In 14 days','Today']);return `<div class="panel"><p class="small muted">The 100 earliest claims ever made here. Active and historical claims qualify after 14 days held.</p>${rows.map(r=>`<div class="boardrow ${r[2].startsWith('In ')?'pending':''}"><strong>#${r[0]}</strong><span>${r[1]}</span><span>${r[2]}</span><span class="hide-mobile">${r[3]}</span></div>`).join('')}</div>`}
function artist(){let can=!(S.artist==='pending'||S.artist==='disputed'||S.artist==='frozen'||S.frozen||S.removed);return `${head('Artist / fictional','Ember Vale',badge(S.verified||S.artist==='verified'?'✓ Verified artist':'Fan-created',!(S.verified||S.artist==='verified')))}<div class="artist-hero"><div><p class="muted">A voice from the edge of the room. Lo-fi folk songs about last trains and borrowed time.</p>${statusCopy()}<div class="statline"><div><strong>${S.claimed?7:6}</strong><span>claimers</span></div><div><strong>23</strong><span>watching</span></div><div><strong>#7</strong><span>${S.claimed?'your number':'next claim'}</span></div></div><div class="actions" style="flex-wrap:wrap">${button(S.claimed?'Already claimed':'Be #7','openClaim','btn',can&&!S.claimed?'':'disabled')}${button(S.watching?'Watching ✓':'Watch','openWatch','btn secondary',can?'':'disabled')}${button('Share','goShare','btn secondary')}</div><p class="small muted">A claim takes one roster slot. Watching takes none.</p></div><div class="hero-art">${record('large')}</div></div><div class="tabs" role="tablist" aria-label="Artist sections">${[['overview','Overview'],['founders','Founders board'],['songs','Top Songs']].map(([id,t])=>`<button role="tab" aria-selected="${S.artistTab===id}" class="${S.artistTab===id?'active':''}" data-tab="artist:${id}">${t}</button>`).join('')}</div>${S.artistTab==='founders'?founders():S.artistTab==='songs'?songs():`<div class="two"><div class="panel"><h3>About this page</h3><p class="muted">${S.verified||S.artist==='verified'?'Ember Vale verified this page through a public profile.':'Listeners made this page to remember who got here first.'}</p><p class="small muted">Added by 3 independent scouts.</p></div><div class="panel"><h3>Early ears</h3><p class="muted">@lena was #1. Every number stays in the record, even when a scout drops an artist.</p>${button('See Founders board','founders','btn secondary')}</div></div>`}<div class="section rule row" style="justify-content:space-between;flex-wrap:wrap"><span class="muted small">Something wrong with this page?</span>${button('Report page','report','btn secondary tiny')}</div><div class="section panel"><label class="fieldlabel" for="pageState">Preview page state</label><select class="field" id="pageState"><option value="unverified" ${S.artist==='unverified'?'selected':''}>Fan-created</option><option value="verified" ${S.artist==='verified'?'selected':''}>Verified</option><option value="pending" ${S.artist==='pending'?'selected':''}>Pending</option><option value="disputed" ${S.artist==='disputed'?'selected':''}>Disputed</option><option value="frozen" ${S.artist==='frozen'?'selected':''}>Frozen</option></select></div>`}
function songs(){return S.verified||S.artist==='verified'?`<div class="panel"><p class="small muted">Selected by the artist. Links open the artist’s public pages.</p>${['Low Lantern','After the Last Train','Borrowed Hours','Small Rooms','A Quiet Exit'].map((x,i)=>`<div class="listrow"><span><b>0${i+1} · ${x}</b></span><a href="https://example.com" target="_blank" rel="noopener">Listen ↗</a></div>`).join('')}<p class="small muted">Support the artist: <a href="https://example.com" target="_blank" rel="noopener">artist’s donation page ↗</a> · outbound link</p></div>`:`<div class="panel"><h3>Top Songs arrive with verification.</h3><p class="muted">The artist can add up to ten songs once this page is verified.</p></div>`}
function share(){return `${head('Your claim, out loud','Pass it on.')}<div class="share-layout"><div><div class="tabs" role="tablist" aria-label="Card size">${[['story','Story · 9:16'],['square','Square · 1:1']].map(([id,t])=>`<button class="${S.shareSize===id?'active':''}" data-tab="size:${id}">${t}</button>`).join('')}</div><div class="tabs" role="tablist" aria-label="Card message">${[['claim','My claim'],['milestone','Milestone']].map(([id,t])=>`<button class="${S.shareKind===id?'active':''}" data-tab="kind:${id}">${t}</button>`).join('')}</div><p class="muted">${S.shareKind==='claim'?'A number worth remembering.':'Milestones make an early number louder.'}</p>${S.shareKind==='milestone'?`<label class="fieldlabel" for="milestone">Claimers reached</label><select class="field" id="milestone"><option value="10" ${S.milestone===10?'selected':''}>10 claimers</option><option value="100" ${S.milestone===100?'selected':''}>100 claimers</option><option value="1000" ${S.milestone===1000?'selected':''}>1,000 claimers</option></select>`:''}<p></p><div class="actions">${button('Share card','shareSheet')}${button('Save card','saveCard','btn secondary')}</div><p class="small muted">The card and link are fictional in this prototype.</p></div><div class="share-preview">${shareCard()}</div></div>`}
function shareCard(){let count=S.milestone.toLocaleString('en-US');return `<div class="sharecard ${S.shareSize}" role="img" aria-label="${S.shareKind==='claim'?`I claimed, number ${S.claimNo}, Ember Vale`:`Number ${S.claimNo} of ${count} claimers now, Ember Vale`}">${record()}<div class="foreground"><small>ClaimedFirst / listening notes</small></div><div class="foreground"><b>${S.shareKind==='claim'?'I claimed.':'I was early.'}</b><div class="n">#${S.claimNo}</div><b>${S.shareKind==='claim'?'Ember Vale.':`of ${count} claimers now.`}</b></div><div class="foreground"><small>${S.shareKind==='claim'?'Ember Vale · June 8':'Ember Vale · milestone'}</small></div></div>`}
function friend(){return `${head('A link from a friend','The number travels.')}<div class="two"><div class="panel"><div class="eyebrow">Chat preview</div><div class="chatbubble"><div>Maya shared a find with you.</div><div class="linkpreview"><strong>ClaimedFirst · Ember Vale</strong><p class="small muted">Maya was #7 on Ember Vale. Be #8.</p></div></div><p class="small muted">A friend can open this link in any browser.</p></div><div class="panel"><div class="eyebrow">Public page / no account needed to read</div><h2>Ember Vale</h2><p>Maya was #7 on Ember Vale.</p><div class="notice neutral">Fan-created page, not verified by the artist</div><p class="muted">The next number in this shared-view example is #8.</p>${button('Be #8','friendClaim')}<p class="small muted">Sign in to claim. The link stays readable without installing anything.</p></div></div>`}
function roster(){if(S.many)return rosterMany();return `${head('Your listening record','Your roster.',button('Invite friends','goInvite','btn secondary'))}<div class="panel"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Slots</div><h3 style="margin:4px 0">${S.full?'5 of 5':S.claimed?'1 of 5':'0 of 5'} in use</h3></div>${badge('5 open')}</div>${slots()}<p class="small muted">Everyone begins with five slots. Friends unlock more room.</p>${button('See invite progress','goInvite','btn ghost tiny')}</div>${S.full?`<div class="notice">Roster full. Drop a claim to free a slot, or bring friends to open more.</div>`:''}${section('Active claims',S.claimed||S.full?`<div class="panel"><div class="listrow"><div class="row">${record()}<span><b>Ember Vale · #${S.claimNo}</b><small>Claimed June 8 · ${({named:'Name shown',artist:'Artist only',anonymous:'Anonymous'})[S.claimPrivacy]}</small></span></div><div class="actions">${button('Privacy','privacyClaim','btn secondary tiny')}${button('Drop','drop','btn secondary tiny')}</div></div>${S.full?Array.from({length:4},(_,i)=>`<div class="listrow"><span><b>${['Sable Current','Morrow Field','Pale Arcade','Low Tide Choir'][i]}</b><small>Claim #${i+12}</small></span></div>`).join(''):''}</div>`:`<div class="panel"><h3>There is room for a first find.</h3><p class="muted">A claim puts your arrival number on the record.</p>${button('Find an artist','goHome')}</div>`)}${section('Historical claims',S.dropped?`<div class="panel"><div class="listrow"><span><b>Ember Vale · Historical claim #7</b><small>Claimed June 8 · dropped June 26 · number kept forever</small></span>${button(S.cooldown?'30-day cooldown':'View','cooldown','btn secondary tiny')}</div></div>`:`<div class="panel muted">Dropped claims live here with their original number and date.</div>`)}${section('Watchlist',S.watching?`<div class="panel"><div class="listrow"><span><b>Ember Vale</b><small>No claim number · no slot · ${S.watchPrivacy==='named'?'name shown':'anonymous'}</small></span><div class="actions">${button('Privacy','privacyWatch','btn secondary tiny')}${button('Remove','unwatch','btn secondary tiny')}</div></div><p class="small muted">1 of 100 watched.</p></div>`:`<div class="panel muted">Follow up to 100 artists without claiming. Your watchlist is empty.</div>`)}<p class="small">${button(S.full?'Show usual roster':'Preview roster-full state','toggleFull','btn ghost tiny')} ${button('Preview long lists (pagination)','toggleMany','btn ghost tiny')}</p>`}
const PAGE=10;
function pw(p,total){const c=Math.max(1,Math.ceil(total/PAGE));const pg=Math.min(c,Math.max(1,Math.floor(p)||1));return {pg,c,from:(pg-1)*PAGE,to:Math.min(total,pg*PAGE)}}
function pagedList(key,title,items,row){const w=pw(S.pg[key],items.length);S.pg[key]=w.pg;return section(title,`<div class="panel">${items.slice(w.from,w.to).map(row).join('')}<div class="listrow"><span class="small muted">Showing ${w.from+1}–${w.to} of ${items.length}</span><span class="actions">${button('← Previous','pgPrev:'+key,'btn secondary tiny',w.pg<=1?'disabled':'')}<span class="small muted">Page ${w.pg} of ${w.c}</span>${button('Next →','pgNext:'+key,'btn secondary tiny',w.pg>=w.c?'disabled':'')}</span></div></div>`)}
function rosterMany(){const art=['Ember Vale','Sable Current','Morrow Field','Pale Arcade','Low Tide Choir'];const mk=(n,off)=>Array.from({length:n},(_,i)=>({name:art[i%5]+' '+(i+1),no:i+off}));return `${head('Your listening record','Your roster.',button('Back to the usual roster','toggleMany','btn secondary'))}<div class="notice neutral">Preview: long lists show 10 per page. Each list pages on its own.</div>${pagedList('a','Active claims',mk(23,7),x=>`<div class="listrow"><span><b>${x.name} · #${x.no}</b><small>Claimed this season</small></span><span class="actions">${button('Privacy','privacyClaim','btn secondary tiny')}${button('Drop','drop','btn secondary tiny')}</span></div>`)}${pagedList('h','Historical claims',mk(25,38),x=>`<div class="listrow"><span><b>${x.name} · Historical claim #${x.no}</b><small>Number kept forever</small></span></div>`)}${pagedList('w','Watchlist',mk(31,1),x=>`<div class="listrow"><span><b>${x.name}</b><small>No number · no slot</small></span>${button('Remove','unwatch','btn secondary tiny')}</div>`)}`}
function profile(){return `${head('Scout / fictional','@maya',badge('Original Scout'))}<div class="two"><div class="panel"><div class="eyebrow">Listening since June</div><h3>Early ears, long memory.</h3><p class="muted">The first 100 accounts keep the Original Scout badge permanently.</p><div class="statline"><div><strong>7</strong><span>earliest claim</span></div><div><strong>4</strong><span>artists found</span></div></div></div><div class="panel"><h3>Scout titles</h3><div class="stack">${badge('Lucky Scout')}${badge('Ear for Talent')}${badge('Legendary Ear',true)}</div><p class="small muted">Titles recognize the artists you found early as they grow.</p></div></div>${section('Historical 100',`<div class="panel"><p class="small muted">Your 100 earliest claim numbers. Historical claims stay, and entries appear after 14 days held.</p>${[['#7','Ember Vale',S.dropped?'Historical claim':'Active'],['#12','Sable Current','Active'],['#38','Morrow Field','Historical claim'],['#41','Pale Arcade','In 9 days']].map((x,i)=>`<div class="boardrow ${i===3?'pending':''}"><strong>${x[0]}</strong><span>${x[1]}</span><span>${x[2]}</span><span class="hide-mobile">${i===3?'Qualifies soon':'June 2026'}</span></div>`).join('')}</div>`)}`}
function leaderboard(){return `${head('September season','The early ears.')}<div class="leader-grid"><div class="panel"><div class="eyebrow">Monthly leaderboard</div><h3>Scouts by points</h3>${[['1','@lena','12,450'],['2','@rue','9,820'],['3','@maya','8,710'],['4','Anonymous scout','7,300'],['5','@niko','6,940']].map(x=>`<div class="table-row ${x[1]==='@maya'?'me':''}"><strong>${x[0]}</strong><span>${x[1]} ${x[1]==='@maya'?'· you':''}</span><b>${x[2]}</b><span class="hide-mobile">points</span></div>`).join('')}<p class="small muted">Season resets monthly. Claim numbers and history never reset.</p></div><div class="panel"><h3>How points work</h3><p class="muted">When an artist you claimed gains new qualified fans, those fans add points to your season score. Earlier numbers get a larger bonus.</p><div class="listrow"><b>Claims #1–10</b><span>5×</span></div><div class="listrow"><b>#11–50</b><span>3×</span></div><div class="listrow"><b>#51–200</b><span>2×</span></div><div class="listrow"><b>#201 onward</b><span>1×</span></div><p class="small muted">Recognition only. No prizes or payouts.</p></div></div>`}
function invite(){let n=S.friendCount,next=n<2?2:n<5?5:n<10?10:n<20?20:20,slots=n<2?5:n<5?10:n<10?20:n<20?30:50;return `${head('Make room for more','Bring a friend.')}<div class="two"><div class="panel"><h3>Your invite link</h3><p class="muted">A friend counts once their account is seven days old and they have made a claim.</p><div class="notice neutral copylink">https://claimedfirst.example/i/maya</div><div class="actions">${button('Copy link','copyInvite')}${button('Share link','shareInvite','btn secondary')}</div><p class="small muted">This is a fictional prototype link.</p></div><div class="panel"><div class="eyebrow">Roster room</div><h3>${slots} slots unlocked</h3><p>${n} qualified ${n===1?'friend':'friends'} · ${next} for the next level</p><div class="progress"><span style="width:${Math.min(100,n/next*100)}%"></span></div><p class="small muted">2 friends → 10 slots · 5 → 20 · 10 → 30 · 20 → 50 max</p>${button('Preview next friend','friendProgress','btn secondary tiny')}</div></div>`}
function manage(){return `${head('For the artist','Make this page yours.',badge(S.verified?'✓ Verified':'Verification needed',!S.verified))}<div class="manage-grid"><div class="panel"><h3>Verify this page</h3><p class="muted">Put this one-time code in the bio of your Suno, YouTube, SoundCloud, TikTok or website page. Then paste that public page here and press Check.</p><div class="notice neutral" style="font-size:1.4rem;letter-spacing:.08em">cf-K7M4QX</div><label class="fieldlabel" for="verifyUrl">Your public page</label><input class="field" id="verifyUrl" type="url" placeholder="https://..."><p></p>${button('Check code','checkCode')}<p class="status ${S.verification==='success'?'good':S.verification==='failure'?'error':'muted'}" role="status">${S.verification==='success'?'Code found. Ember Vale is verified.':S.verification==='failure'?'Code not found on that page. Keep the code in your public bio and try again.':'Use a public page you control.'}</p><p class="small muted">Prototype: enter https://example.com/success for success; any other https address shows failure.</p></div><div class="panel"><h3>Page controls</h3><label class="choice"><input type="checkbox" id="freeze" ${S.frozen?'checked':''} ${S.verified?'':'disabled'}> Freeze new claims</label><p class="small muted">Current claims and their numbers remain.</p>${button('Remove page','remove','btn secondary',S.verified?'':'disabled')}<p class="small muted">Only a verified artist can use these controls.</p></div></div>${section('Top Songs editor',`<div class="panel"><p class="muted">Add up to 10 songs. Each song needs a title and an https link.</p><div id="songRows">${Array.from({length:S.songCount},(_,i)=>`<div class="two" style="margin:10px 0"><input class="field song-title" aria-label="Song ${i+1} title" placeholder="Song ${i+1} title" value="${['Low Lantern','After the Last Train','Borrowed Hours','Small Rooms','A Quiet Exit'][i]||''}"><input class="field song-url" aria-label="Song ${i+1} https link" type="url" placeholder="https://..." value="${i<5?'https://example.com/song-'+(i+1):''}"></div>`).join('')}</div><div class="actions" style="flex-wrap:wrap">${button('Add song','addSong','btn secondary tiny',S.songCount>=10?'disabled':'')}${button('Remove last','removeSong','btn secondary tiny',S.songCount<=1?'disabled':'')}${button('Save songs','saveSongs','btn',S.verified?'':'disabled')}</div><p class="status muted" id="songStatus" role="status">Verify first to publish songs.</p></div>`)}${section('Donation link',`<div class="panel"><p class="muted">Optional plain outbound link. The app never handles money.</p><label class="fieldlabel" for="donation">Artist’s donation page</label><input class="field" id="donation" type="url" placeholder="https://..."><p></p>${button('Save link','saveDonation','btn secondary',S.verified?'':'disabled')}</div>`)}${section('Your audience',`<div class="panel"><div class="statline"><div><strong>1,000</strong><span>claimed</span></div><div><strong>23</strong><span>watching: 3 named, 20 anonymous</span></div></div><div class="tabs">${[['claimed','Claimed'],['watching','Watching']].map(([id,t])=>`<button class="${S.audienceTab===id?'active':''}" data-tab="audience:${id}">${t}</button>`).join('')}</div>${S.audienceTab==='claimed'?`<div class="listrow"><span>@maya</span><span>Claim #7</span></div><div class="listrow"><span>Anonymous scout</span><span>Claim #8</span></div><p class="small muted">All claimers are counted. Names follow each scout’s privacy choice.</p>`:`<div class="listrow"><span>@rue</span><span>Named watcher</span></div><div class="listrow"><span>@niko</span><span>Named watcher</span></div><div class="listrow"><span>@lena</span><span>Named watcher</span></div><p class="small muted">23 watching: 3 named, 20 anonymous. Only named watchers appear individually.</p>`}</div>`)}`}
function notifications(){return `${head('From your artists','In the loop.')}<div class="panel list"><div class="listrow"><span><b>Ember Vale just hit 1,000 claimers.</b><small>You were #7. A new milestone card is ready.</small></span>${button('Share','milestone','btn secondary tiny')}</div><div class="listrow"><span><b>Sable Current has a new Top Song.</b><small>Selected by the verified artist.</small></span>${button('View','goArtist','btn secondary tiny')}</div><div class="listrow"><span><b>Your Founders board entry is live.</b><small>Your claim has been held for 14 days.</small></span>${button('View','founders','btn secondary tiny')}</div></div>`}
function terms(){return `${head('The small print','Terms & privacy.')}<div class="notice neutral">Draft · prototype copy. This is not a published policy.</div><div class="two"><div class="panel"><h3>Terms · draft</h3><p class="muted">Claims are a record of arrival, not ownership of an artist. Numbers stay attached to each claim. Dropping a claim frees a slot and starts a 30-day wait before a new claim on that artist.</p><p class="muted">Recognition only. No prizes, cash or payments.</p></div><div class="panel"><h3>Privacy · draft</h3><p class="muted">Choose whether your handle appears with each claim or watch. Anonymous activity still counts. Artists see true totals, and only named watchers appear individually.</p><p class="muted">This prototype uses fictional data and does not send information to a service.</p></div></div>`}
function modal(){if(!S.modal)return '';let body='';if(S.modal==='claim'||S.modal==='watch'||S.modal==='privacyClaim'||S.modal==='privacyWatch'){let w=S.modal.toLowerCase().includes('watch'),privacy=w?S.watchPrivacy:S.claimPrivacy;body=`<h2>${S.modal.startsWith('privacy')?'Who can see your name?':w?'Watch Ember Vale':'Claim Ember Vale'}</h2><p class="muted">${w?'Follow without a number or roster slot.':'Your number is permanent. This uses one roster slot.'}</p><label class="choice"><input type="radio" name="privacy" value="named" ${privacy==='named'?'checked':''}><strong>${w?'Name visible to the artist':'Show my name'}</strong><br><span class="small muted">${w?'The artist can see your handle. The public never sees who watches.':'The artist, the Founders board and your profile show your handle.'}</span></label>${w?'':`<label class="choice"><input type="radio" name="privacy" value="artist" ${privacy==='artist'?'checked':''}><strong>Artist only</strong><br><span class="small muted">The artist sees you are a fan. Everyone else sees “Anonymous scout.”</span></label>`}<label class="choice"><input type="radio" name="privacy" value="anonymous" ${privacy==='anonymous'?'checked':''}><strong>${w?'Anonymous':'Anonymous'}</strong><br><span class="small muted">${w?'Counted, but the artist never sees your name.':'Nobody sees your name, not even the artist. Still counted and scored.'}</span></label><div class="actions">${button(S.modal.startsWith('privacy')?'Save choice':w?'Add to watchlist':'Make my claim','confirmPrivacy')}${button('Cancel','close','btn secondary')}</div>`}else if(S.modal==='success'){body=`<div class="eyebrow">Claim recorded</div><div class="big-number stamp">#${S.claimNo}</div><h2>You got here early.</h2><p>Ember Vale is on your roster. This number is yours, even if you drop the claim.</p><div class="actions">${button('Make a card','goShare')}${button('See roster','goRoster','btn secondary')}</div>`}else if(S.modal==='drop'){body=`<h2>Leave this spot open?</h2><p>Claim #7 becomes a Historical claim. It keeps its number and June 8 date, and this slot opens. You cannot claim Ember Vale again for 30 days. After that, you get a new, later number. Both claims stay on your profile.</p><div class="actions">${button('Drop claim','confirmDrop')}${button('Keep it','close','btn secondary')}</div>`}else if(S.modal==='cooldown'){body=`<h2>Give it 30 days.</h2><p>You dropped Ember Vale. Historical claim #7 is safe, but re-adding this artist is blocked for 30 days. Your next claim will receive a later number.</p>${button('Back to roster','close')}`}else if(S.modal==='shareSheet'){body=`<h2>Share this find</h2><p class="muted">Send the public link. Friends can read the page in a browser.</p><div class="notice neutral copylink">https://claimedfirst.example/c/ember-vale/7</div><div class="actions">${button('Copy link','copyShare')}${button('See friend’s view','goFriend','btn secondary')}</div>`}else if(S.modal==='report'){body=`<h2>Report this page</h2><p class="muted">Tell us what looks wrong. This prototype keeps the report here.</p><label class="fieldlabel" for="reportReason">Reason</label><select id="reportReason" class="field"><option>Wrong artist or identity</option><option>Impersonation</option><option>Incorrect link</option><option>Other</option></select><label class="fieldlabel" for="reportDetail">Details</label><input class="field" id="reportDetail" placeholder="A little more context"><p></p>${button('Send report','sendReport')}`}else if(S.modal==='remove'){body=`<h2>Remove this page?</h2><p>It will no longer accept claims or appear in discovery. Existing scouts keep their historical records and numbers.</p><div class="actions">${button('Remove page','confirmRemove')}${button('Keep page','close','btn secondary')}</div>`}else if(S.modal==='notClaimable'){body=`<h2>Claims are paused.</h2><p>This artist is pending, disputed, frozen or removed. You can return when claims reopen.</p>${button('Close','close')}`}else if(S.modal==='full'){body=`<h2>Your roster is full.</h2><p>Drop a claim to open a slot or bring friends to unlock more.</p><div class="actions">${button('View roster','goRoster')}${button('Invite friends','goInvite','btn secondary')}</div>`}else if(S.modal==='already'){body=`<h2>Already on your roster.</h2><p>Your first claim on Ember Vale is #7. A scout can have one active claim per artist.</p>${button('See roster','goRoster')}`}
return `<div class="overlay" data-action="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="ClaimedFirst dialog"><div class="sheet-head"><span class="eyebrow">ClaimedFirst</span><button class="plain" data-action="close" aria-label="Close dialog">✕</button></div>${body}</div></div>`}
function handleMessage(x){if(!x)return 'Your handle is your name on the record.';if(!/^[a-z0-9_]{3,20}$/.test(x))return 'Use 3–20 lowercase letters, numbers or underscores.';if(['admin','support','claimedfirst','artist','scout','maya'].includes(x))return ['maya'].includes(x)?'That handle is taken.':'That handle is reserved.';return 'That handle is available.'}
function page(){return ({landing,login,onboarding,home,submit,artist,share,friend,roster,profile,leaderboard,invite,manage,notifications,terms})[S.page]()}
function render(keepScroll=false){let y=window.scrollY;document.getElementById('app').innerHTML=layout(page());if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);if(S.modal)document.querySelector('.sheet button')?.focus()}
function toast(t){S.toast=t;render(true);clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{S.toast='';render(true)},3500)}
function go(p){S.page=p;S.modal='';render()}
function chosenPrivacy(){return document.querySelector('input[name=privacy]:checked')?.value||'named'}
document.addEventListener('input',e=>{if(e.target.id==='handle'){S.handle=e.target.value;S.handleOK=handleMessage(S.handle)==='That handle is available.';let st=document.getElementById('handleStatus');st.textContent=handleMessage(S.handle);st.className='status '+(S.handleOK?'good':'error');document.getElementById('keepHandle').disabled=!S.handleOK}});
document.addEventListener('change',e=>{if(e.target.id==='freeze'){S.frozen=e.target.checked;S.artist=S.frozen?'frozen':'verified';toast(S.frozen?'New claims frozen.':'New claims reopened.')}if(e.target.id==='pageState'){S.artist=e.target.value;S.frozen=false;render(true)}if(e.target.id==='milestone'){S.milestone=Number(e.target.value);render(true)}});
document.addEventListener('click',async e=>{let pg=e.target.closest('[data-page]');if(pg){e.preventDefault();go(pg.dataset.page);return}let tab=e.target.closest('[data-tab]');if(tab){let [which,v]=tab.dataset.tab.split(':');S[{artist:'artistTab',size:'shareSize',kind:'shareKind',audience:'audienceTab'}[which]]=v;render(true);return}let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;if(a==='backdrop'&&e.target!==el)return;if(a.startsWith('pgPrev:')||a.startsWith('pgNext:')){let k=a.split(':')[1];S.pg[k]+=a.startsWith('pgNext')?1:-1;render(true);return}switch(a){case 'mode':S.mode=S.mode==='desktop'?'mobile':'desktop';render();break;case 'close':case 'backdrop':S.modal='';render(true);break;case 'goHome':go('home');break;case 'goArtist':S.artist='unverified';go('artist');break;case 'goSubmit':go('submit');break;case 'goInvite':go('invite');break;case 'goShare':go('share');break;case 'goFriend':go('friend');break;case 'goRoster':go('roster');break;case 'founders':S.artistTab='founders';go('artist');break;case 'pendingArtist':S.artist='pending';go('artist');break;case 'openClaim':S.modal=S.claimed?'already':S.cooldown?'cooldown':S.full?'full':(!['pending','disputed','frozen'].includes(S.artist)&&!S.frozen&&!S.removed?'claim':'notClaimable');render(true);break;case 'openWatch':S.modal='watch';render(true);break;case 'privacyClaim':S.modal='privacyClaim';render(true);break;case 'privacyWatch':S.modal='privacyWatch';render(true);break;case 'confirmPrivacy':{let w=S.modal.toLowerCase().includes('watch'),edit=S.modal.startsWith('privacy');if(w){S.watchPrivacy=chosenPrivacy();S.watching=true;S.modal='';toast(edit?'Watch privacy saved.':'Added to your watchlist.')}else{S.claimPrivacy=chosenPrivacy();if(edit){S.modal='';toast('Claim privacy saved.')}else{S.claimed=true;S.dropped=false;S.modal='success';render(true)}}break}case 'drop':S.modal='drop';render(true);break;case 'confirmDrop':S.claimed=false;S.dropped=true;S.cooldown=true;S.modal='';toast('Claim #7 moved to Historical claims.');break;case 'cooldown':S.modal='cooldown';render(true);break;case 'unwatch':S.watching=false;toast('Removed from watchlist.');break;case 'toggleMany':S.many=!S.many;S.pg={a:1,h:1,w:1};render(true);break;case 'toggleFull':S.full=!S.full;render(true);break;case 'guest':if(!document.getElementById('guest').checkValidity()||!document.getElementById('guest').value){document.getElementById('guest').reportValidity();break}toast('You are on the fictional guest list.');break;case 'magic':if(!document.getElementById('loginEmail').checkValidity()||!document.getElementById('loginEmail').value){document.getElementById('loginEmail').reportValidity();break}toast('A fictional sign-in link is on its way.');break;case 'loginGo':go('onboarding');break;case 'saveHandle':if(S.handleOK)toast(`@${S.handle} is yours in this prototype.`);break;case 'submitArtist':{let n=document.getElementById('artistName'),l=document.getElementById('artistLink');if(!n.value.trim()||!l.value.startsWith('https://')){toast('Add a name and an https public link.');break}S.artist='pending';go('artist');toast('Submitted. This page needs 3 independent scouts.');break}case 'friendClaim':go('login');toast('Sign in to take the next number.');break;case 'milestone':S.shareKind='milestone';go('share');break;case 'shareSheet':S.modal='shareSheet';render(true);break;case 'saveCard':saveCard();break;case 'copyShare':case 'copyInvite':{let link=a==='copyShare'?'https://claimedfirst.example/c/ember-vale/7':'https://claimedfirst.example/i/maya';try{await navigator.clipboard.writeText(link);toast('Link copied.')}catch{toast('Copy the link shown on this page.')}break}case 'shareInvite':if(navigator.share){navigator.share({title:'Join me on ClaimedFirst',url:'https://claimedfirst.example/i/maya'}).catch(()=>{})}else toast('Copy the fictional link to share it.');break;case 'friendProgress':S.friendCount=Math.min(20,S.friendCount+1);render(true);break;case 'report':S.modal='report';render(true);break;case 'sendReport':S.modal='';toast('Report noted in this prototype.');break;case 'checkCode':{let u=document.getElementById('verifyUrl').value;S.verification=u==='https://example.com/success'?'success':'failure';if(S.verification==='success'){S.verified=true;S.artist='verified'}render(true);break}case 'addSong':S.songCount=Math.min(10,S.songCount+1);render(true);break;case 'removeSong':S.songCount=Math.max(1,S.songCount-1);render(true);break;case 'saveSongs':{let titles=[...document.querySelectorAll('.song-title')],urls=[...document.querySelectorAll('.song-url')],ok=titles.length>=1&&titles.length<=10&&titles.every((t,i)=>t.value.trim()&&/^https:\/\/.+/.test(urls[i].value));let st=document.getElementById('songStatus');st.textContent=ok?'Top Songs saved in this prototype.':'Add 1 to 10 songs, each with a title and https link.';st.className='status '+(ok?'good':'error');break}case 'saveDonation':{let u=document.getElementById('donation').value;toast(!u||u.startsWith('https://')?'Donation link saved in this prototype.':'Use an https link.');break}case 'remove':S.modal='remove';render(true);break;case 'confirmRemove':S.removed=true;S.modal='';go('artist');toast('Artist page removed in this prototype.');break;default:break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal='';render(true)}});
function saveCard(){let canvas=document.createElement('canvas'),story=S.shareSize==='story';canvas.width=story?1080:1080;canvas.height=story?1920:1080;let c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.fillStyle='#172019';c.fillRect(0,0,w,h);c.strokeStyle='#354839';for(let r=100;r<750;r+=17){c.beginPath();c.arc(w/2,h*.39,r,0,Math.PI*2);c.stroke()}c.fillStyle='#e48c72';c.beginPath();c.arc(w/2,h*.39,120,0,Math.PI*2);c.fill();c.fillStyle='#f3efe5';c.font='38px Georgia';c.fillText('CLAIMEDFIRST / LISTENING NOTES',70,90);c.font='bold 85px Georgia';c.fillText(S.shareKind==='claim'?'I claimed.':'I was early.',70,h-430);c.fillStyle='#e48c72';c.font='220px Georgia';c.fillText('#7',70,h-210);c.fillStyle='#f3efe5';c.font='65px Georgia';c.fillText(S.shareKind==='claim'?'Ember Vale.':'of 1,000 claimers now.',70,h-105);let a=document.createElement('a');a.download=`claimedfirst-${S.shareKind}-${S.shareSize}.png`;a.href=canvas.toDataURL('image/png');a.click();toast('Card saved as an image.')}
render();
</script>
